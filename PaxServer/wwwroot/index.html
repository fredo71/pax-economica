<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles/page.css">
  <link rel="stylesheet" href="styles/map.css">
  <link rel="stylesheet" href="styles/panel.css">
</head>
  <body>
    <div class="map-container">
      <div id="map"></div>
    </div>

    <!-- both hidden until sidePanel.ts shows one -->
    <aside id="entity-panel" class="panel" hidden>
      <h2 id="entity-name" class="panel-title"></h2>
      <div class="panel-owner">
        <span id="entity-owner-swatch" class="owner-swatch"></span>
        <span id="entity-owner-name"></span>
      </div>
      <div class="value-row">
        <div class="value-name">Location</div>
        <button id="entity-location" class="panel-button"></button>
      </div>
    </aside>
    <aside id="province-panel" class="panel" hidden>
      <h2 id="province-name" class="panel-title"></h2>
      <div id="province-owner" class="panel-owner">
        <span id="owner-swatch" class="owner-swatch"></span>
        <span id="owner-name"></span>
      </div>
      <div id="province-entities"></div>
      <div id="institution-panel"></div>
    </aside>              <!-- last: painted on top -->
    <button id="tick-button" class="tick-button">Next turn</button>
    <pre id="province-text" class="text-box"></pre>
    <pre id="error-text" class="text-box"></pre>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- compiled modules keep `from "zod"` as written; this tells the browser where that is. same version as package.json -->
    <script type="importmap">
      { "imports": { "zod": "https://cdn.jsdelivr.net/npm/zod@4.6.5/+esm" } }
    </script>
    <script type="module" src="main.js"></script>
<template id="dropdown-template">
  <details class="dropdown">
    <summary class="dropdown-title"></summary>
    <div class="dropdown-content"></div>
  </details>
</template>
<template id="entity-row-template">
  <button class="entity-row panel-button">
    <span class="owner-swatch"></span>
    <span class="entity-row-name"></span>
  </button>
</template>
<template id="value-row-template">
  <div class="value-row">
    <div class="value-name"></div>
    <div class="value-figure"></div>
  </div>
</template>
  </body>
</html>
