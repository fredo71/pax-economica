name: Build and deploy PaxServer

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: pax-economica
  PROJECT_FOLDER: PaxServer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_FOLDER }}/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # the type packages the TypeScript compile needs
      - name: Install npm packages
        run: npm ci
        working-directory: ${{ env.PROJECT_FOLDER }}

      # compiles the TypeScript into wwwroot as part of the build; a type error fails here
      - name: Publish
        run: dotnet publish ${{ env.PROJECT_FOLDER }}/PaxServer.csproj -c Release -o publishedSite

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: publishedSite

  # only main reaches Azure; every other push and pull request just proves the build works
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: publishedSite

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publishedSite
